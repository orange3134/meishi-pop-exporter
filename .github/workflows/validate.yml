name: Validate Packages
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: exporter-packages
          path: dist/
          retention-days: 7
      - name: Save Unitypackage for manual Booth upload
        uses: actions/upload-artifact@v4
        with:
          name: booth-unitypackage
          path: dist/*.unitypackage
          if-no-files-found: error
          retention-days: 30
      - name: Show Booth handoff
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTE'
          ## Boothへの手動アップロード

          Artifactsの **booth-unitypackage** をダウンロードして展開し、
          中の **MEISHI-Pop-Exporter-*.unitypackage** をBoothの商品ファイルに登録してください。
          Boothへのログイン・アップロード・公開は自動実行しません。
          公開版はGitHub Releaseから同じUnitypackageを直接取得できます。
          NOTE
